<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuscleTick Stats</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="#" class="back-link" id="backLink">&#x2190; back</a>
      <div class="header-main">
        <img src="icons/icon48.png" alt="MuscleTick" class="logo">
        <h1>your gains</h1>
      </div>
      <p class="tagline">look at you go &#x1F4AA;</p>
    </header>

    <section class="hero-stats">
      <div class="hero-card time-saved">
        <div class="hero-icon">&#x23F1;&#xFE0F;</div>
        <div class="hero-value" id="totalTimeSaved">0h 0m</div>
        <div class="hero-label">total time saved</div>
        <div class="hero-sub" id="timeSavedContext">that's like watching 0 movies</div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">&#x1F6E1;&#xFE0F;</div>
        <div class="stat-value" id="totalBlocks">0</div>
        <div class="stat-label">distractions blocked</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#x1F4AA;</div>
        <div class="stat-value" id="totalExercises">0</div>
        <div class="stat-label">exercises completed</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-icon">&#x1F525;</div>
        <div class="stat-value" id="currentStreak">0</div>
        <div class="stat-label">day streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">&#x1F4C5;</div>
        <div class="stat-value" id="todayBlocks">0</div>
        <div class="stat-label">blocked today</div>
      </div>
    </section>

    <section class="weekly-section">
      <h2>this week</h2>
      <div class="week-chart" id="weekChart">
        <!-- Generated by JS -->
      </div>
    </section>

    <section class="achievements-section">
      <h2>achievements</h2>
      <div class="achievements-grid" id="achievementsGrid">
        <!-- Generated by JS -->
      </div>
    </section>

    <section class="fun-facts">
      <h2>fun facts</h2>
      <div class="fact-card" id="funFacts">
        <p id="factText">calculating your gains...</p>
      </div>
    </section>

    <footer>
      <p>keep grinding, you're doing amazing &#x1F31F;</p>
    </footer>
  </div>

  <script src="stats.js"></script>
</body>
</html>
